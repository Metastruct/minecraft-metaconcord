plugins {
	id 'net.neoforged.moddev' version '2.0.78'
}

// Vanilla-only mode: compiles against Mojang-mapped vanilla plus its libraries
// (gson, slf4j, log4j-core), no NeoForge APIs on the classpath. The jar built
// here is never shipped; each loader project compiles these sources into its
// own jar.
neoForge {
	neoFormVersion = neoform_version
}
